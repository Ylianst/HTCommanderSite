<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bluetooth pairing">
  <defs>
    <linearGradient id="btGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3a8" />
    </linearGradient>
    <radialGradient id="btGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- glow backdrop -->
  <circle cx="160" cy="150" r="150" fill="url(#btGlow)" />

  <!-- pairing rings -->
  <circle cx="160" cy="150" r="118" fill="none" stroke="#2e3a4d" stroke-width="2" stroke-dasharray="4 10" opacity="0.7" />
  <circle cx="160" cy="150" r="92" fill="none" stroke="url(#btGrad)" stroke-width="2" opacity="0.35" />

  <!-- signal waves left -->
  <g stroke="url(#btGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M64 128 a34 34 0 0 0 0 44" />
    <path d="M48 116 a58 58 0 0 0 0 68" opacity="0.6" />
  </g>
  <!-- signal waves right -->
  <g stroke="url(#btGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M256 128 a34 34 0 0 1 0 44" />
    <path d="M272 116 a58 58 0 0 1 0 68" opacity="0.6" />
  </g>

  <!-- Bluetooth glyph -->
  <g transform="translate(160 150)">
    <circle r="66" fill="#10151e" stroke="url(#btGrad)" stroke-width="3" />
    <path
      d="M-20 20 L20 -20 L0 -40 L0 40 L20 20 L-20 -20"
      fill="none"
      stroke="url(#btGrad)"
      stroke-width="7"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>
</svg>
